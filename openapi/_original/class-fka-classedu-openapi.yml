        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Per-organization API key presented as a Bearer token in the
        Authorization header (Authorization: Bearer <api_key_secret>). The key
        secret is shown only once, at key creation, in the Admin UI. Each key is
        granted a set of permission scopes; selecting a write scope
        automatically grants the matching read scope. Documented scopes:
        class:read, class:write, enrollment:read, enrollment:write,
        attendance:read, metrics:read, schedule:read, schedule:write,
        template:read, template:write, user:read, user:write.
  parameters:
    Page:
      name: page
      in: query
      description: Page number to retrieve (positive integer).
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: Records per page (1-1000).
      required: false
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    ClassId:
      name: class_id
      in: query
      description: Class identifier assigned by Class.
      required: false
      schema: { type: string }
    ExtClassId:
      name: ext_class_id
      in: query
      description: External class identifier supplied by the integrator.
      required: false
      schema: { type: string }
    ScheduleId:
      name: schedule_id
      in: query
      description: Schedule (class date) identifier.
      required: false
      schema: { type: string }
    TemplateId:
      name: template_id
      in: query
      description: Template identifier.
      required: false
      schema: { type: string }
    UserId:
      name: id
      in: query
      description: User identifier assigned by Class.
      required: false
      schema: { type: string }
    ExtUserId:
      name: ext_user_id
      in: query
      description: External user identifier supplied by the integrator.
      required: false
      schema: { type: string }
  schemas:
    Pagination:
      type: object
      properties:
        total_records: { type: integer }
        current_page: { type: integer }
        total_pages: { type: integer }
        next_page: { type: [integer, 'null'] }
        prev_page: { type: [integer, 'null'] }
    SessionTime:
      type: object
      properties:
        start_time: { type: integer, description: Unix time. }
        end_time: { type: integer, description: Unix time. }
    ClassSettings:
      type: object
      properties:
        waiting_room: { type: boolean }
        join_before_host: { type: boolean }
        jbh_time: { type: integer }
    Instructor:
      type: object
      properties:
        email: { type: string, format: email }
        user_name: { type: string }
    TrackingField:
      type: object
      properties:
        field: { type: string }
        value: { type: string }
    ClassCreate:
      type: object
      required: [class_name]
      properties:
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        display_name: { type: string }
        ext_class_id: { type: string }
        class_name: { type: string }
        class_description: { type: string }
        template_id: { type: string }
        meeting_passcode: { type: string }
        timezone: { type: string, description: Time Zone ID. }
        session_times:
          type: array
          items: { $ref: '#/components/schemas/SessionTime' }
        settings: { $ref: '#/components/schemas/ClassSettings' }
        additional_instructors:
          type: array
          items: { $ref: '#/components/schemas/Instructor' }
        tracking_fields:
          type: array
          items: { $ref: '#/components/schemas/TrackingField' }
    ClassUpdate:
      allOf:
        - $ref: '#/components/schemas/ClassCreate'
    Class:
      type: object
      properties:
        class_id: { type: string }
        ext_class_id: { type: string }
        class_deferred_id: { type: string }
        class_name: { type: string }
        class_description: { type: string }
        timezone: { type: string }
    EnrollmentCreate:
      type: object
      properties:
        class_id: { type: string }
        ext_class_id: { type: string }
        ext_person_id: { type: string }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        role: { type: string }
        display_name: { type: string }
    Enrollment:
      type: object
      properties:
        student_id: { type: string }
        ext_person_id: { type: string }
        email: { type: string, format: email }
        class_id: { type: string }
        role: { type: string }
    Launch:
      type: object
      properties:
        launch_url: { type: string, format: uri }
    ScheduleCreate:
      type: object
      required: [class_id, start_time, end_time]
      properties:
        class_id: { type: string }
        start_time: { type: integer, description: Unix time. }
        end_time: { type: integer, description: Unix time. }
        timezone: { type: string, deprecated: true, description: Time Zone ID (deprecated). }
    Schedule:
      type: object
      properties:
        schedule_id: { type: string }
        session_id: { type: string }
        class_id: { type: string }
        start_time: { type: integer }
        end_time: { type: integer }
    TemplateCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        status: { type: string }
    Template:
      type: object
      properties:
        template_id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string }
    UserUpsert:
      type: object
      properties:
        identified_by: { type: string, description: Which identifier the request keys on (id or ext_user_id). }
        id: { type: string }
        ext_user_id: { type: string }
        email: { type: string, format: email }
        user_name: { type: string }
        roles:
          type: array
          items: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        ext_user_id: { type: string }
        email: { type: string, format: email }
        user_name: { type: string }
        roles:
          type: array
          items: { type: string }
    Report:
      type: object
      properties:
        data:
          type: array
          items: { type: object, additionalProperties: true }
        pagination: { $ref: '#/components/schemas/Pagination' }
    Error:
      type: object
      properties:
        message: { type: string, description: Human-readable explanation of the failure. }
  responses:
    ClassResponse:
      description: A class.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Class' }
    ClassListResponse:
      description: A page of classes.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/Class' }
              pagination: { $ref: '#/components/schemas/Pagination' }
    EnrollmentResponse:
      description: An enrollment.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Enrollment' }
    EnrollmentListResponse:
      description: A page of enrollments.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/Enrollment' }
              pagination: { $ref: '#/components/schemas/Pagination' }
    LaunchResponse:
      description: A learner launch link.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Launch' }
    ReportResponse:
      description: A reporting result set.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Report' }
    ScheduleResponse:
      description: A class date.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Schedule' }
    ScheduleListResponse:
      description: A page of class dates.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/Schedule' }
              pagination: { $ref: '#/components/schemas/Pagination' }
    TemplateResponse:
      description: A template.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Template' }
    TemplateListResponse:
      description: A page of templates.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/Template' }
              pagination: { $ref: '#/components/schemas/Pagination' }
    UserResponse:
      description: A user.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/User' }
    UserListResponse:
      description: A page of users.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/User' }
              pagination: { $ref: '#/components/schemas/Pagination' }
    Deleted:
      description: The resource was removed.
    BadRequest:
      description: Bad Request - validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Unauthorized - missing or invalid API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
