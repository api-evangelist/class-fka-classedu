    get:
      operationId: getTemplates
      summary: Get templates
      description: Get all templates, or a single template by template_id.
      tags: [Templates]
      security:
        - bearerAuth: [template:read]
      parameters:
        - $ref: '#/components/parameters/TemplateId'
