  /api/v1/users:
    put:
      operationId: upsertUser
      summary: Create or Update a User
      tags: [Users]
      security:
        - bearerAuth: [user:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpsert'
      responses:
