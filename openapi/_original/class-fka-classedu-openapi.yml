        '404': { $ref: '#/components/responses/NotFound' }
    get:
      operationId: getClassDates
      summary: Get Class Dates
      tags: [Schedules]
      security:
        - bearerAuth: [schedule:read]
      parameters:
        - $ref: '#/components/parameters/ClassId'
        - $ref: '#/components/parameters/ExtClassId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/ScheduleListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: removeClassDate
      summary: Remove a Class Date
      tags: [Schedules]
      security:
        - bearerAuth: [schedule:write]
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/templates:
    post:
      operationId: createTemplate
      summary: Create a Template
      tags: [Templates]
      security:
        - bearerAuth: [template:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreate'
      responses:
        '201': { $ref: '#/components/responses/TemplateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
