openapi: 3.1.0
info:
  title: Class Developer API
  version: v1
  x-apievangelist-provenance:
    generated: '2026-07-18'
    method: generated
    source: https://developer.class.com/
    note: >-
      Faithful OpenAPI reconstruction of the operations, paths, HTTP methods,
      authentication scheme, permission scopes, pagination model and documented
      request fields published on developer.class.com. Request/response object
      schemas capture only fields named in the public documentation; no fields
      were invented. This is an API Evangelist generated spec, not a
      Class-published artifact.
  description: >-
    REST API for Class (fka ClassEDU), the virtual classroom platform built for
    Zoom and Microsoft Teams. The API lets administrators and integrators
    provision classes, manage enrollments, generate learner launch links,
    schedule class dates, manage reusable class templates, manage non-learner
    users, and pull attendance and engagement reporting. Authentication uses a
    per-organization API key presented as a Bearer token, gated by permission
    scopes.
  contact:
    name: Class Developer Platform
    url: https://developer.class.com/
  termsOfService: https://www.class.com/terms-of-service/
servers:
  - url: https://{organization}.class.com
    description: >-
      Base URL is unique to each organization and is retrieved from the API Keys
      page in the Class Admin UI after an API key is created.
    variables:
      organization:
        default: your-organization
        description: Your organization's Class subdomain.
security:
  - bearerAuth: []
tags:
  - name: Classes
    description: Create, read, update and remove classes.
  - name: Enrollments
    description: Enroll learners into classes and manage their enrollment records.
  - name: Launch
    description: Generate a one-time access link for a learner to join a class.
  - name: Reporting
    description: Attendance and engagement metrics reporting.
  - name: Schedules
    description: Manage the scheduled dates (sessions) for a class.
  - name: Templates
    description: Manage reusable class templates.
  - name: Users
    description: Manage non-learner users (instructors, admins).
paths:
  /api/v1/classes:
    post:
      operationId: createClass
      summary: Create a Class
      description: Create a new class, optionally from a template.
      tags: [Classes]
      security:
        - bearerAuth: [class:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassCreate'
      responses:
        '201': { $ref: '#/components/responses/ClassResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      operationId: getClasses
      summary: Get class information
      description: >-
        Retrieve information for all classes, or a single class when a
        class_id or ext_class_id is supplied.
      tags: [Classes]
      security:
        - bearerAuth: [class:read]
      parameters:
        - $ref: '#/components/parameters/ClassId'
        - $ref: '#/components/parameters/ExtClassId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/ClassListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateClass
      summary: Update a Class
      tags: [Classes]
      security:
        - bearerAuth: [class:write]
      parameters:
        - $ref: '#/components/parameters/ClassId'
        - $ref: '#/components/parameters/ExtClassId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassUpdate'
      responses:
        '200': { $ref: '#/components/responses/ClassResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteClass
      summary: Remove a Class
      tags: [Classes]
      security:
        - bearerAuth: [class:write]
      parameters:
        - $ref: '#/components/parameters/ClassId'
        - $ref: '#/components/parameters/ExtClassId'
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/class/enrollments:
    post:
      operationId: createEnrollment
      summary: Create an Enrollment
      tags: [Enrollments]
      security:
        - bearerAuth: [enrollment:write]
      requestBody:
        required: true
        content:
