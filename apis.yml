aid: class-fka-classedu
name: Class (fka ClassEDU)
description: >-
  Class (fka ClassEDU) is a virtual classroom platform, founded in 2020 by
  education-technology leader Michael Chasen, that adds a full teaching and
  learning layer on top of Zoom and Microsoft Teams for K-12, higher education,
  government, and corporate training. The platform provides interactive course
  setup and templates, real-time engagement analytics and attendance tracking,
  enhanced breakout rooms, polls, whiteboards, auto transcription, an AI
  assistant, proctoring, and LMS integrations. Class also publishes a REST
  developer API (developer.class.com) that lets administrators and integrators
  provision classes, manage enrollments, generate learner launch links, schedule
  class dates, manage class templates, manage non-learner users, and pull
  attendance and engagement reporting, authenticated with a per-organization API
  key presented as a Bearer token and gated by permission scopes.
